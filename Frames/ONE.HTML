<html>
<head>
    <title>My Learning Platform</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:grid;
    grid-template-rows:10vh 5vh 85vh;
    height:100vh;
    font-family:Arial, sans-serif;
}

/* Header */
.header{
    background:#6666ff;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Menu */
.menu{
    background:#b3b3ff;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
}

.menu a{
    text-decoration:none;
    color:#000;
    font-weight:bold;
}

.menu a:hover{
    color:blue;
}

/* Content */
.content iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

    <!-- Frame 1 -->
    <div class="header">
        <h1>My Learning Platform</h1>
    </div>

    <!-- Frame 2 -->
    <div class="menu">
        <a href="home.html" target="frame_three">Home</a>
        <a href="sample.html" target="frame_three">HTML</a>
        <a href="sample.html" target="frame_three">CSS</a>
        <a href="Regform.html" target="frame_three">Forms</a>
        <a href="containers.html" target="frame_three">Containers</a>
        <a href="scripts.html" target="frame_three">JavaScript</a>
    </div>

    <!-- Frame 3 -->
    <div class="content">
        <iframe src="home.html" name="frame_three"></iframe>
         <iframe src="sample.html" name="frame_three"></iframe>
        
    </div>

</body>
</html>
