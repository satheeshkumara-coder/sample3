<html>
<head>    
    <title>Registration Form</title>
    <style>
        /* Base setup to center the form box on the page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The Form Box Container */
        .form-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 450px; /* Controls the overall width of the box */
        }

        .form-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }

        /* Grid Layout: Ensures labels and inputs align perfectly with equal sizing */
        .form-group {
            display: grid;
            grid-template-columns: 1fr 2fr; /* 1 part label space, 2 parts input space */
            align-items: center;
            gap: 15px; /* Space between label and input */
            margin-bottom: 20px; /* Space between rows */
        }

        /* Label Styling */
        .form-group label {
            font-weight: bold;
            color: #555;
        }

        /* Input Styling: Setting width to 100% makes them fill the grid column exactly */
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Crucial: includes padding in width calculation */
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* Submit Button Styling */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Register</h2>
        <form>
            <!-- Full Name Row -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <!-- Email Row -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <!-- Password Row -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <!-- Confirm Password Row -->
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat your password" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</body>
</html>
